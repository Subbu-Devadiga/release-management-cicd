name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python syntax
        run: python -m py_compile application/app.py


  test:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run automated tests
        run: python -m unittest discover -s tests -v
  package:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create release metadata
        run: |
          echo "Release Version: 1.0.0" > release-metadata.txt
          echo "Git Commit: $GITHUB_SHA" >> release-metadata.txt
          echo "Git Branch: $GITHUB_REF_NAME" >> release-metadata.txt
          echo "Release Date: $(date -u)" >> release-metadata.txt
      - name: Create application package
        run: |
          mkdir release-package
          cp application/app.py release-package/
          cp application/version.txt release-package/
          cp README.md release-package/
          cp release-metadata.txt release-package/
	  cp change-request.txt release-package/
          cd release-package
          zip -r ../release-management-app-v1.0.0.zip .

      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-management-app-v1.0.0
          path: release-management-app-v1.0.0.zip

  validate-release:
    needs: package
    runs-on: ubuntu-latest

    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: release-management-app-v1.0.0
          path: validation-package

      - name: Extract release artifact
        run: |
          mkdir validation-environment
          unzip validation-package/release-management-app-v1.0.0.zip -d validation-environment

      - name: Validate required release files
        run: |
          echo "===== RELEASE VALIDATION ====="

          test -f validation-environment/app.py
          echo "✓ app.py exists"

          test -f validation-environment/version.txt
          echo "✓ version.txt exists"

          test -f validation-environment/release-metadata.txt
          echo "✓ release-metadata.txt exists"

          test -f validation-environment/README.md
          echo "✓ README.md exists"

      - name: Validate release version
        run: |
          VERSION=$(cat validation-environment/version.txt)

          if [ "$VERSION" != "1.0.0" ]; then
            echo "Release version validation failed."
            exit 1
          fi

          echo "✓ Release version validated: $VERSION"

      - name: Validate release metadata
        run: |
          grep -q "Release Version: 1.0.0" validation-environment/release-metadata.txt
          grep -q "Git Commit:" validation-environment/release-metadata.txt
          grep -q "Git Branch:" validation-environment/release-metadata.txt

          echo "✓ Release metadata validated"

      - name: Release readiness result
        run: |
          echo "================================"
          echo "RELEASE VALIDATION PASSED"
          echo "Release is ready for DEV deployment."
          echo "================================"


  deploy-dev:
    needs: validate-release
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Download application artifact
        uses: actions/download-artifact@v4
        with:
          name: release-management-app-v1.0.0
          path: deployment-package

      - name: Extract application
        run: |
          mkdir dev-environment
          unzip deployment-package/release-management-app-v1.0.0.zip -d dev-environment

      - name: Deploy application to DEV
        run: |
          echo "Deploying application to DEV environment..."
          cp -r dev-environment/* deployment-package/
          echo "Deployment completed successfully."

      - name: Verify DEV deployment
        run: |
          python deployment-package/app.py
          echo "DEV deployment verification completed."
      - name: Create DEV deployment record
        run: |
          VERSION=$(cat deployment-package/version.txt)

          {
            echo "# 🔧 DEV Deployment Record"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Release Version | $VERSION |"
            echo "| Environment | DEV |"
            echo "| Artifact | release-management-app-v1.0.0 |"
            echo "| Deployment Status | SUCCESS |"
            echo "| Deployment Time | $(date -u) |"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-uat:
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: uat

    steps:
      - name: Download application artifact
        uses: actions/download-artifact@v4
        with:
          name: release-management-app-v1.0.0
          path: deployment-package

      - name: Extract application
        run: |
          mkdir uat-environment
          unzip deployment-package/release-management-app-v1.0.0.zip -d uat-environment

      - name: Deploy application to UAT
        run: |
          echo "Deploying application to UAT environment..."
          echo "UAT deployment completed successfully."

      - name: Verify UAT deployment
        run: |
          python uat-environment/app.py
          echo "UAT deployment verification completed."
      - name: Create UAT deployment record
        run: |
          VERSION=$(cat uat-environment/version.txt)

          {
            echo "# 🧪 UAT Deployment Record"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Release Version | $VERSION |"
            echo "| Environment | UAT |"
            echo "| Artifact | release-management-app-v1.0.0 |"
            echo "| Deployment Status | SUCCESS |"
            echo "| Deployment Time | $(date -u) |"
          } >> "$GITHUB_STEP_SUMMARY"
  deploy-production:
    needs: deploy-uat
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Download application artifact
        uses: actions/download-artifact@v4
        with:
          name: release-management-app-v1.0.0
          path: deployment-package

      - name: Extract application
        run: |
          mkdir production-environment
          unzip deployment-package/release-management-app-v1.0.0.zip -d production-environment
      - name: Display release information
        run: |
          echo "===== RELEASE INFORMATION ====="
          cat production-environment/release-metadata.txt
          echo "================================"
      - name: Validate production change request
        run: |
          echo "===== CHANGE REQUEST VALIDATION ====="

          test -f production-environment/change-request.txt
          echo "✓ Change request file exists"

          grep -q "Change ID: CHG0012345" production-environment/change-request.txt
          echo "✓ Change ID validated"

          grep -q "Release Version: 1.0.0" production-environment/change-request.txt
          echo "✓ Release version matches change"

          grep -q "Environment: PRODUCTION" production-environment/change-request.txt
          echo "✓ Target environment validated"

          grep -q "Status: Approved" production-environment/change-request.txt
          echo "✓ Change approval status validated"

          echo "===================================="
          echo "CHANGE REQUEST VALIDATION PASSED"
          echo "Production deployment is authorized."
          echo "===================================="
      - name: Create Production deployment record
        run: |
          VERSION=$(grep "Release Version:" production-environment/release-metadata.txt | cut -d':' -f2- | xargs)
          COMMIT=$(grep "Git Commit:" production-environment/release-metadata.txt | cut -d':' -f2- | xargs)
          BRANCH=$(grep "Git Branch:" production-environment/release-metadata.txt | cut -d':' -f2- | xargs)
	  CHANGE_ID=$(grep "Change ID:" production-environment/change-request.txt | cut -d':' -f2- | xargs)

          {
            echo "# 🚀 Production Deployment Record"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Release Version | $VERSION |"
	    echo "| Change Request | $CHANGE_ID |"
            echo "| Environment | PRODUCTION |"
            echo "| Git Branch | $BRANCH |"
            echo "| Git Commit | $COMMIT |"
            echo "| Artifact | release-management-app-v1.0.0 |"
            echo "| Deployment Status | SUCCESS |"
            echo "| Deployment Time | $(date -u) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy application to Production
        run: |
          echo "Deploying application to PRODUCTION..."
          cp production-environment/app.py production-environment/version.txt /tmp/
          echo "Production deployment completed successfully."

      - name: Verify Production deployment
        run: |
          python production-environment/app.py
          echo "Production deployment verification completed."

      - name: Record deployed version
        run: |
          echo "Current Production Version:"
          cat production-environment/version.txt
  rollback-production:
    needs: deploy-production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Download application artifact
        uses: actions/download-artifact@v4
        with:
          name: release-management-app-v1.0.0
          path: deployment-package

      - name: Rollback Production
        run: |
          echo "Starting Production rollback..."
          echo "Restoring previous stable version: 1.0.0"
          echo "Production rollback completed successfully."

      - name: Verify rollback
        run: |
          echo "Verifying Production after rollback..."
          echo "Previous stable version is now active."
          echo "Rollback verification completed successfully."